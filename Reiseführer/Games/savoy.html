<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reise-Station XIV: Brief an Löwy</title>
  <style>
    body {
      background: #fdfcf7;
      color: #2c2a29;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #info {
      display: none;
      font-size: 12px;
      color: #7d756b;
      margin-bottom: 8px;
      text-align: center;
      max-width: 450px;
    }
    /* Game Intro Overlay */
    .intro-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fdfcf7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 2000;
      text-align: center;
      transition: opacity 0.35s ease;
    }
    .intro-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .intro-box {
      background: #fcfaf2;
      border: 1px solid rgba(139, 128, 115, 0.3);
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .intro-stamp {
      border: 2px dashed #b82e24;
      color: #b82e24;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .intro-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #2c2a29;
    }
    .intro-text {
      font-size: 11.5px;
      line-height: 1.5;
      color: #5c5650;
      margin-bottom: 20px;
    }
    .intro-btn {
      background: #b82e24;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 11px;
    }
    .intro-btn:hover {
      background: #962018;
    }
    .letter-paper {
      width: 90%;
      max-width: 450px;
      height: 60vh;
      background: #e8e6df;
      color: #222;
      padding: 25px;
      border-radius: 4px;
      border: 1px solid rgba(139, 128, 115, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .letter-header {
      font-size: 11px;
      text-align: right;
      color: #444;
      margin-bottom: 15px;
    }
    .letter-salutation {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .letter-body {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      resize: none;
      outline: none;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      line-height: 1.6;
      color: #222;
      border-bottom: 1px dashed rgba(0,0,0,0.08);
      padding: 5px 0;
    }
    .letter-signature {
      font-size: 13px;
      font-weight: bold;
      text-align: right;
      margin-top: 15px;
    }
    .action-bar {
      margin-top: 10px;
    }
    .btn {
      background: #b82e24;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 12px;
    }
    .btn:hover {
      background: #962018;
    }
    .btn:disabled {
      background: rgba(139, 128, 115, 0.15);
      color: rgba(0,0,0,0.25);
      cursor: not-allowed;
      opacity: 0.6;
    }
    #char-count {
      font-size: 9px;
      color: #7d756b;
      text-align: right;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div id="info">Schreiben Sie einen Brief an Ihren Freund Jizchak Löwy (mind. 20 Zeichen).</div>

  <div class="letter-paper">
    <div class="letter-header">Prag, 1912</div>
    <div class="letter-salutation">Lieber Jizchak,</div>
    <textarea 
      class="letter-body" 
      id="letterBody" 
      placeholder="Wie geht es dir auf deinen Reisen? Ich schreibe dir..." 
      maxlength="200"
      oninput="validateLetter()"></textarea>
    <div id="char-count">Zeichen: 0 / 200</div>
    <div class="letter-signature">Dein Franz</div>
  </div>

  <div class="action-bar">
    <button class="btn" id="submitBtn" onclick="submitLetter()" disabled>Aufgabe abschließen</button>
  </div>

  <script>
    let gameStarted = false;
    const textarea = document.getElementById('letterBody');
    const submitBtn = document.getElementById('submitBtn');
    const charCount = document.getElementById('char-count');

    function validateLetter() {
      if (!gameStarted) return;
      const text = textarea.value.trim();
      charCount.textContent = `Zeichen: ${text.length} / 200`;
      
      if (text.length >= 20) {
        submitBtn.disabled = false;
      } else {
        submitBtn.disabled = true;
      }
    }

    function submitLetter() {
      const text = textarea.value.trim();
      
      // Create canvas in memory to generate a screenshot (high-res)
      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 600;
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      
      // Fill vintage background
      ctx.fillStyle = '#e8e6df';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Letter header
      ctx.fillStyle = '#444';
      ctx.font = '10px "Courier New"';
      ctx.textAlign = 'right';
      ctx.fillText("Prag, 1912", 370, 30);

      // Letter salutation
      ctx.fillStyle = '#222';
      ctx.font = 'bold 12px "Courier New"';
      ctx.textAlign = 'left';
      ctx.fillText("Lieber Jizchak,", 30, 60);

      // Letter text wrapper
      ctx.font = '11px "Courier New"';
      
      function wrap(context, txt, x, y, maxWidth, lineHeight) {
        const words = txt.split(' ');
        let line = '';
        for (let n = 0; n < words.length; n++) {
          let testLine = line + words[n] + ' ';
          let metrics = context.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
          } else {
            line = testLine;
          }
        }
        context.fillText(line, x, y);
        return y;
      }

      const finalY = wrap(ctx, text, 30, 95, 260, 18);

      // Letter signature
      ctx.font = 'bold 12px "Courier New"';
      ctx.fillText("Dein Franz", 200, Math.max(finalY + 30, 220));

      // Tragedy mask smiley removed

      // Draw stamp in corner
      ctx.save();
      ctx.strokeStyle = '#b82e24';
      ctx.fillStyle = '#b82e24';
      ctx.lineWidth = 2;
      ctx.translate(330, 250);
      ctx.rotate(-Math.PI / 10);
      ctx.strokeRect(-40, -12, 80, 24);
      ctx.font = 'bold 9px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText("BESUCHT", 0, 4);
      ctx.restore();

      const imgData = canvas.toDataURL('image/png');

      window.parent.postMessage({
        type: 'GAME_SUCCESS',
        data: imgData,
        text: text
      }, '*');
    }

    function startAfterIntro() {
      document.getElementById('introOverlay').classList.add('hidden');
      gameStarted = true;
    }
  </script>
  <div class="intro-overlay" id="introOverlay">
    <div class="intro-box">
      <div class="intro-stamp">Aufgabe</div>
      <h2 class="intro-title">Café Savoy</h2>
      <p class="intro-text">Verfassen Sie einen persönlichen Brief an den jiddischen Schauspieler Jizchak Löwy, mit dem Kafka eine tiefe und langjährige Freundschaft verband.</p>
      <button class="intro-btn" onclick="startAfterIntro()">Spiel starten</button>
    </div>
  </div>
</body>
</html>
