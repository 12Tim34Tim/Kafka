<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reise-Station VIII: Denkmal-Ritt</title>
  <style>
    body {
      background: #fdfcf7;
      color: #2c2a29;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #info-bar {
      display: none;
      width: 100%;
      max-width: 600px;
      justify-content: space-between;
      font-size: 13px;
      color: #7d756b;
      margin-bottom: 5px;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 250px;
      background: #fdfcf7;
      border: 1px solid rgba(139, 128, 115, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .mobile-controls {
      display: flex;
      width: 100%;
      max-width: 600px;
      justify-content: space-around;
      margin-top: 10px;
    }

    .control-btn {
      flex: 1;
      margin: 0 10px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 15px;
      font-size: 14px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }

    .control-btn:active {
      background: #444;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .stamp {
      border: 3px double #d32f2f;
      color: #d32f2f;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      transform: rotate(-8deg);
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .btn {
      background: #d32f2f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
    }

    .btn:hover {
      background: #b71c1c;
    }

    /* Game Intro Overlay */
    .intro-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fdfcf7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 2000;
      text-align: center;
      transition: opacity 0.35s ease;
    }

    .intro-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .intro-box {
      background: #fcfaf2;
      border: 1px solid rgba(139, 128, 115, 0.3);
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .intro-stamp {
      border: 2px dashed #b82e24;
      color: #b82e24;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .intro-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #2c2a29;
    }

    .intro-text {
      font-size: 11.5px;
      line-height: 1.5;
      color: #5c5650;
      margin-bottom: 20px;
    }

    .intro-btn {
      background: #b82e24;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 11px;
    }

    .intro-btn:hover {
      background: #962018;
    }
  </style>
</head>

<body>

  <div id="info-bar">
    <div id="distance">Strecke: 0 m</div>
  </div>

  <div class="game-container" id="gameArea">
    <canvas id="runnerCanvas" width="600" height="250"></canvas>

    <!-- Game Over Overlay -->
    <div class="overlay" id="gameOverOverlay">
      <div id="overlayText"
        style="margin-bottom: 10px; font-size: 13px; text-align: center; line-height: 1.5; color: #fff;">
        Sie sind gestürzt.
      </div>
      <div id="highscoreBox" style="margin-bottom: 15px; font-size: 11px; text-align: center; color: #ccc; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 10px; width: 100%; max-width: 250px; font-family: 'Courier New', Courier, monospace;">
        Lade Bestenliste...
      </div>
      <div style="display: flex; gap: 15px;">
        <button class="btn" onclick="saveAndContinue()">Weitermachen</button>
        <button class="btn" style="background: #5c5650;" onclick="restartGame()">Wiederholen</button>
      </div>
    </div>
  </div>

  <!-- Touch Assist for mobile layout -->
  <div class="mobile-controls">
    <div class="control-btn" id="jumpBtn">SPRINGEN</div>
    <div class="control-btn" id="slideBtn">DUCKEN</div>
  </div>

  <div class="intro-overlay" id="introOverlay">
    <div class="intro-box">
      <div class="intro-stamp">Aufgabe</div>
      <h2 class="intro-title">Franz Kafka Denkmal</h2>
      <p class="intro-text">Reiten Sie auf den Schultern des Riesen durch die Prager Gassen. Weichen Sie Kisten durch
        Springen (Swipe Up / Pfeiltaste Hoch) und Pferdewagen durch Ducken (Swipe Down / Pfeiltaste Runter) aus.</p>
      <button class="intro-btn" onclick="startAfterIntro()">Spiel starten</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const playerName = urlParams.get('name') || "Spieler";

    const canvas = document.getElementById('runnerCanvas');
    canvas.width = 1200;
    canvas.height = 500;
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    const distanceText = document.getElementById('distance');
    const overlay = document.getElementById('gameOverOverlay');
    const overlayText = document.getElementById('overlayText');

    // Load monument image
    const monumentImg = new Image();
    let imgLoaded = false;
    monumentImg.onload = () => {
      imgLoaded = true;
    };
    monumentImg.src = '../Assests/Denkmal.png';

    // Game variables
    let gameActive = true;
    let distance = 0;
    let speed = 2.0;
    const maxSpeed = 5.0;
    const groundY = 210;

    // Headless rider
    const rider = {
      x: 50,
      y: groundY - 80,
      width: 45,
      height: 80,
      normalHeight: 80,
      slideHeight: 40,
      velocityY: 0,
      gravity: 0.5,
      jumpPower: -9.5,
      isJumping: false,
      isSliding: false
    };

    let obstacles = [];
    let spawnTimer = 0;

    // Obstacle types
    // 'crate': low obstacle, width=25, height=30. MUST jump.
    // 'carriage': high obstacle, width=50, height=35, suspended so bottom clearance is 45px (y is groundY - 80 to groundY - 45). MUST slide.

    function spawnObstacle() {
      const rand = Math.random();
      if (rand > 0.5) {
        // Crate
        obstacles.push({
          x: 600,
          y: groundY - 30,
          width: 25,
          height: 30,
          type: 'crate'
        });
      } else {
        // Carriage
        obstacles.push({
          x: 600,
          y: groundY - 80,
          width: 55,
          height: 35,
          type: 'carriage'
        });
      }
    }

    // Keyboard controls
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'ArrowUp' || e.code === 'Space') {
        e.preventDefault();
        triggerJump();
      }
      if (e.code === 'ArrowDown') {
        e.preventDefault();
        triggerSlide(true);
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.code] = false;
      if (e.code === 'ArrowDown') {
        triggerSlide(false);
      }
    });

    // Touch controls (Buttons)
    document.getElementById('jumpBtn').addEventListener('touchstart', e => {
      e.preventDefault();
      triggerJump();
    });
    document.getElementById('slideBtn').addEventListener('touchstart', e => {
      e.preventDefault();
      triggerSlide(true);
    });
    document.getElementById('slideBtn').addEventListener('touchend', e => {
      e.preventDefault();
      triggerSlide(false);
    });

    // Touch Swipe Detection
    let touchStartY = 0;
    const gameArea = document.getElementById('gameArea');

    gameArea.addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
    });

    gameArea.addEventListener('touchmove', e => {
      e.preventDefault(); // Stop rubber banding
    });

    gameArea.addEventListener('touchend', e => {
      const touchEndY = e.changedTouches[0].clientY;
      const diffY = touchEndY - touchStartY;

      if (diffY < -30) {
        triggerJump();
      } else if (diffY > 30) {
        triggerSlide(true);
        setTimeout(() => triggerSlide(false), 600); // Slide for 600ms on swipe down
      }
    });

    function triggerJump() {
      if (!rider.isJumping && !rider.isSliding && gameActive) {
        rider.isJumping = true;
        rider.velocityY = rider.jumpPower;
      }
    }

    function triggerSlide(active) {
      if (!gameActive) return;
      if (active) {
        if (!rider.isJumping) {
          rider.isSliding = true;
          rider.height = rider.slideHeight;
          rider.y = groundY - rider.slideHeight;
        }
      } else {
        rider.isSliding = false;
        rider.height = rider.normalHeight;
        if (!rider.isJumping) {
          rider.y = groundY - rider.normalHeight;
        }
      }
    }

    // Main Game Loop
    function update() {
      if (!gameActive) return;

      // Distance increment
      distance += 0.5;
      distanceText.textContent = `Strecke: ${Math.floor(distance)} m`;

      // Speed scale
      speed = 2.0 + (distance / 400);
      if (speed > maxSpeed) speed = maxSpeed;

      // Physics for rider
      if (rider.isJumping) {
        rider.velocityY += rider.gravity;
        rider.y += rider.velocityY;

        // Ground check
        if (rider.y >= groundY - rider.height) {
          rider.y = groundY - rider.y > 0 ? groundY - rider.height : groundY - rider.height;
          rider.y = groundY - rider.height;
          rider.isJumping = false;
          rider.velocityY = 0;
        }
      }

      // Spawn obstacles
      spawnTimer -= 1;
      if (spawnTimer <= 0) {
        spawnObstacle();
        spawnTimer = 60 + Math.random() * 80 - (speed * 4); // Adaptive spawn rates
      }

      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision Check
        if (checkCollision(rider, obs)) {
          gameOver();
          return;
        }

        // Remove offscreen
        if (obs.x + obs.width < 0) {
          obstacles.splice(i, 1);
        }
      }

      // Draw
      draw();

      requestAnimationFrame(update);
    }

    function checkCollision(r, o) {
      // Bounding box collision
      return (
        r.x < o.x + o.width &&
        r.x + r.width > o.x &&
        r.y < o.y + o.height &&
        r.y + r.height > o.y
      );
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#fdfcf7';
      ctx.fillRect(0, 0, 600, 250);

      // Draw Ground
      ctx.strokeStyle = '#8b8073';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(600, groundY);
      ctx.stroke();

      // Draw Rider (Kafka monument image)
      if (imgLoaded) {
        ctx.drawImage(monumentImg, rider.x, rider.y, rider.width, rider.height);
      } else {
        // Fallback: drawn tall standing silhouette
        ctx.fillStyle = '#5c5650';
        ctx.fillRect(rider.x, rider.y, rider.width, rider.height);
      }

      // Draw Obstacles
      obstacles.forEach(o => {
        if (o.type === 'crate') {
          ctx.fillStyle = '#c2a678';
          ctx.fillRect(o.x, o.y, o.width, o.height);
          // Draw crate cross lines
          ctx.strokeStyle = '#222';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(o.x, o.y, o.width, o.height);
          ctx.beginPath();
          ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + o.width, o.y + o.height);
          ctx.moveTo(o.x + o.width, o.y); ctx.lineTo(o.x, o.y + o.height);
          ctx.stroke();
        } else {
          // Carriage
          ctx.fillStyle = '#832a2a';
          ctx.fillRect(o.x, o.y, o.width, o.height);
          // Suspended roof
          ctx.fillStyle = '#222';
          ctx.fillRect(o.x - 4, o.y - 4, o.width + 8, 5);
          // Wheels underneath (visual only, collision box does not cover wheels gap)
          ctx.fillStyle = '#444';
          ctx.beginPath();
          ctx.arc(o.x + 12, groundY - 10, 10, 0, 2 * Math.PI);
          ctx.arc(o.x + o.width - 12, groundY - 10, 10, 0, 2 * Math.PI);
          ctx.fill();
        }
      });

      // If game is over, draw the final red tint and score info on the canvas
      if (!gameActive) {
        ctx.fillStyle = 'rgba(211, 47, 47, 0.2)';
        ctx.fillRect(0, 0, 600, 250);

        ctx.fillStyle = '#b82e24';
        ctx.font = 'bold 12px "Courier New"';
        ctx.textAlign = 'right';
        ctx.fillText(`Strecke: ${Math.floor(distance)}m`, 580, 30);
      }
    }

    function gameOver() {
      gameActive = false;

      // Paint collision on canvas
      draw();

      document.getElementById('overlayText').innerHTML = `Sie sind gestürzt.<br>Strecke: <strong>${Math.floor(distance)}m</strong>`;
      overlay.classList.add('active');

      submitAndLoadHighscores('denkmal', Math.floor(distance));
    }

    function submitAndLoadHighscores(game, score) {
      const highscoreBox = document.getElementById('highscoreBox');
      if (!highscoreBox) return;

      highscoreBox.innerHTML = "Speichere und lade Bestenliste...";

      fetch('/api/highscore', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          game: game,
          name: playerName,
          score: score
        })
      })
      .then(response => {
        if (!response.ok) throw new Error("HTTP error " + response.status);
        return response.json();
      })
      .then(data => {
        // Find player's rank in the full list
        let myRank = -1;
        for (let i = 0; i < data.highscores.length; i++) {
          if (data.highscores[i].name === playerName && data.highscores[i].score === score) {
            myRank = i + 1;
            break;
          }
        }

        let html = '<div style="font-weight:bold;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;color:#fff;">🏆 BESTENLISTE 🏆</div>';
        html += '<table style="width:100%;font-size:10px;border-collapse:collapse;color:#ccc;margin-bottom:8px;">';
        
        // Render only the top 5
        const topFive = data.highscores.slice(0, 5);
        topFive.forEach((entry, idx) => {
          const isCurrent = (entry.name === playerName && entry.score === score && idx + 1 === myRank);
          const style = isCurrent ? 'font-weight:bold;color:#fff;background:rgba(255,255,255,0.15);' : '';
          html += `<tr style="${style}">
            <td style="padding:2px 4px;text-align:left;">${idx + 1}. ${entry.name}</td>
            <td style="padding:2px 4px;text-align:right;">${entry.score}m</td>
          </tr>`;
        });
        html += '</table>';

        // Show player's own rank below the top 5
        if (myRank !== -1) {
          html += `<div style="font-size:10px;font-weight:bold;color:#fff;border-top:1px dashed rgba(255,255,255,0.25);padding-top:6px;margin-top:6px;text-transform:uppercase;">Ihr Platz: ${myRank} mit ${score}m</div>`;
        } else {
          html += `<div style="font-size:10px;font-weight:bold;color:#fff;border-top:1px dashed rgba(255,255,255,0.25);padding-top:6px;margin-top:6px;text-transform:uppercase;">Ihr Platz: - mit ${score}m</div>`;
        }

        highscoreBox.innerHTML = html;
      })
      .catch(err => {
        console.error("Failed to load highscores:", err);
        highscoreBox.innerHTML = "Bestenliste konnte nicht geladen werden.";
      });
    }

    function saveAndContinue() {
      let screenShot = "";
      try {
        // Attempt to capture the main canvas directly (renders statue image correctly on web servers)
        screenShot = canvas.toDataURL('image/png');
      } catch (err) {
        console.warn("Canvas is tainted. Generating offscreen fallback.", err);
        try {
          const offscreen = document.createElement('canvas');
          offscreen.width = canvas.width;
          offscreen.height = canvas.height;
          const octx = offscreen.getContext('2d');

          // Scale offscreen context to match main canvas (2x)
          octx.scale(2, 2);

          // Draw Background
          octx.fillStyle = '#fdfcf7';
          octx.fillRect(0, 0, 600, 250);

          // Draw Ground
          octx.strokeStyle = '#8b8073';
          octx.lineWidth = 2;
          octx.beginPath();
          octx.moveTo(0, groundY);
          octx.lineTo(600, groundY);
          octx.stroke();

          // Draw Rider silhouette (stylized vector silhouette fallback)
          octx.fillStyle = '#5c5650';
          octx.fillRect(rider.x + 10, rider.y + 25, 25, 55); // Torso/coat
          octx.beginPath();
          octx.arc(rider.x + 22, rider.y + 15, 6, 0, 2 * Math.PI); // Head
          octx.fill();
          octx.fillRect(rider.x + 13, rider.y + 70, 7, 10); // Leg

          // Draw Obstacles
          obstacles.forEach(o => {
            if (o.type === 'crate') {
              octx.fillStyle = '#c2a678';
              octx.fillRect(o.x, o.y, o.width, o.height);
              octx.strokeStyle = '#222';
              octx.lineWidth = 1.5;
              octx.strokeRect(o.x, o.y, o.width, o.height);
              octx.beginPath();
              octx.moveTo(o.x, o.y); octx.lineTo(o.x + o.width, o.y + o.height);
              octx.moveTo(o.x + o.width, o.y); octx.lineTo(o.x, o.y + o.height);
              octx.stroke();
            } else {
              octx.fillStyle = '#832a2a';
              octx.fillRect(o.x, o.y, o.width, o.height);
              octx.fillStyle = '#222';
              octx.fillRect(o.x - 4, o.y - 4, o.width + 8, 5);
              octx.fillStyle = '#444';
              octx.beginPath();
              octx.arc(o.x + 12, groundY - 10, 10, 0, 2 * Math.PI);
              octx.arc(o.x + o.width - 12, groundY - 10, 10, 0, 2 * Math.PI);
              octx.fill();
            }
          });

          // Draw red tint overlay and score text
          if (!gameActive) {
            octx.fillStyle = 'rgba(211, 47, 47, 0.2)';
            octx.fillRect(0, 0, 600, 250);

            octx.fillStyle = '#b82e24';
            octx.font = 'bold 12px "Courier New"';
            octx.textAlign = 'right';
            octx.fillText(`Strecke: ${Math.floor(distance)}m`, 580, 30);
          }

          screenShot = offscreen.toDataURL('image/png');
        } catch (fallbackErr) {
          console.error("Failed to generate offscreen screenshot:", fallbackErr);
          screenShot = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
        }
      }

      window.parent.postMessage({
        type: 'GAME_SUCCESS',
        data: screenShot
      }, '*');
    }

    function restartGame() {
      distance = 0;
      speed = 2.0;
      obstacles = [];
      spawnTimer = 60;
      rider.y = groundY - rider.height;
      rider.velocityY = 0;
      rider.isJumping = false;
      rider.isSliding = false;
      gameActive = true;
      overlay.classList.remove('active');
      update();
    }

    function startAfterIntro() {
      document.getElementById('introOverlay').classList.add('hidden');
      document.getElementById('info-bar').style.display = 'flex';
      update();
    }
  </script>
</body>

</html>
