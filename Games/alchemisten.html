<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Reise-Station VII: Alchemistengasse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fdfcf7;
      color: #2c2a29;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      padding: 6px;
    }
    #info {
      display: none;
      font-size: 11px;
      color: #7d756b;
      margin-bottom: 5px;
      text-align: center;
      line-height: 1.3;
      flex-shrink: 0;
    }
    .canvas-wrapper {
      position: relative;
      border: 1px solid rgba(139, 128, 115, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      flex: 1;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #fdfcf7;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* Game Intro Overlay */
    .intro-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fdfcf7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 2000;
      text-align: center;
      transition: opacity 0.35s ease;
    }
    .intro-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .intro-box {
      background: #fcfaf2;
      border: 1px solid rgba(139, 128, 115, 0.3);
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .intro-stamp {
      border: 2px dashed #b82e24;
      color: #b82e24;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .intro-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #2c2a29;
    }
    .intro-text {
      font-size: 11.5px;
      line-height: 1.5;
      color: #5c5650;
      margin-bottom: 20px;
    }
    .intro-btn {
      background: #b82e24;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 11px;
    }
    .intro-btn:hover {
      background: #962018;
    }
  </style>
</head>
<body>

  <div id="info">Klicken Sie die fliegenden Wörter in der richtigen Reihenfolge an (Zitatsatz vervollständigen).</div>

  <div class="canvas-wrapper">
    <canvas id="alchCanvas"></canvas>
  </div>

  <div class="intro-overlay" id="introOverlay">
    <div class="intro-box">
      <div class="intro-stamp">Aufgabe</div>
      <h2 class="intro-title">Alchemistengasse 22</h2>
      <p class="intro-text">Helfen Sie Kafka, sein literarisches Zitat im Goldenen Gässchen zu verfassen. Klicken Sie die umherschwirrenden Wörter in der exakten Reihenfolge an.</p>
      <button class="intro-btn" onclick="startAfterIntro()">Spiel starten</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('alchCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.querySelector('.canvas-wrapper');
    let gameStarted = false;

    // Resize canvas internal resolution to match its CSS display size
    function resizeCanvas() {
      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        // Recalculate page geometry
        updateLayout();
        // Re-seed word positions if words already exist
        if (activeWords.length > 0) {
          repositionWords();
        }
      }
    }

    // Page layout — computed from canvas size
    let pageX, pageY, pageW, pageH, poolTop;

    function updateLayout() {
      const cw = canvas.width;
      const margin = Math.max(12, Math.round(cw * 0.04));
      pageX = margin;
      pageY = margin;
      pageW = cw - margin * 2;

      // Simulate text layout to find how many lines the quote needs
      ctx.font = 'bold 11px "Courier New"';
      const textX = pageX + 20;
      let cdX = textX;
      let lines = 1;
      quoteWords.forEach(word => {
        const wordWidth = ctx.measureText(word).width + 6;
        if (cdX + wordWidth > pageX + pageW - 20) {
          cdX = textX;
          lines++;
        }
        cdX += wordWidth;
      });

      // pageH = top padding (30) + lines × lineHeight (20) + bottom padding (45 for signature)
      pageH = 30 + lines * 20 + 45;

      // Word pool starts 12px below the page bottom
      poolTop = pageY + pageH + 12;
    }

    // Quote words
    const quoteWords = [
      "Es", "hatte", "viele", "Mängel", "des", "Anfangs,", "ich", "habe",
      "nicht", "Zeit", "genug,", "um", "die", "Entwicklung", "zu",
      "erzählen.", "Heute", "entspricht", "es", "mir", "ganz", "und", "gar."
    ];

    let currentIndex = 0;
    let gameActive = true;
    let wrongWordTimer = 0;
    let wrongWordItem = null;

    // Word objects
    const activeWords = [];

    function makeWord(word, idx) {
      ctx.font = 'bold 11px "Courier New"';
      const textWidth = ctx.measureText(word).width + 14;
      const textHeight = 22;
      const cw = canvas.width;
      const ch = canvas.height;
      const x = 4 + Math.random() * (cw - textWidth - 8);
      const poolH = ch - poolTop - textHeight - 4;
      const y = poolTop + (poolH > 0 ? Math.random() * poolH : 0);
      const speed = 0.25 + Math.random() * 0.25;
      const angle = Math.random() * 2 * Math.PI;
      return {
        word, originalIdx: idx,
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        width: textWidth,
        height: textHeight
      };
    }

    function initWords() {
      activeWords.length = 0;
      quoteWords.forEach((word, idx) => {
        activeWords.push(makeWord(word, idx));
      });
    }

    function repositionWords() {
      activeWords.forEach(w => {
        const cw = canvas.width;
        const ch = canvas.height;
        w.x = Math.min(w.x, cw - w.width - 4);
        w.y = Math.max(poolTop + 2, Math.min(w.y, ch - w.height - 4));
      });
    }

    // Canvas click / touch handler
    function handleInteraction(clientX, clientY) {
      if (!gameStarted) return;
      if (!gameActive) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = ((clientX - rect.left) / rect.width) * canvas.width;
      const clickY = ((clientY - rect.top) / rect.height) * canvas.height;
      handleHit(clickX, clickY);
    }

    canvas.addEventListener('click', (e) => {
      handleInteraction(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      handleInteraction(t.clientX, t.clientY);
    }, { passive: false });

    function handleHit(clickX, clickY) {
      let clickedItem = null;
      for (let i = 0; i < activeWords.length; i++) {
        const w = activeWords[i];
        if (clickX >= w.x && clickX <= w.x + w.width &&
            clickY >= w.y && clickY <= w.y + w.height) {
          clickedItem = w;
          break;
        }
      }
      if (clickedItem) {
        if (clickedItem.originalIdx === currentIndex) {
          currentIndex++;
          const idx = activeWords.indexOf(clickedItem);
          if (idx > -1) activeWords.splice(idx, 1);
          if (currentIndex === quoteWords.length) {
            gameActive = false;
            finishGame();
          }
        } else {
          wrongWordItem = clickedItem;
          wrongWordTimer = 30;
        }
      }
    }

    function handleWordCollisions() {
      for (let i = 0; i < activeWords.length; i++) {
        for (let j = i + 1; j < activeWords.length; j++) {
          const w1 = activeWords[i];
          const w2 = activeWords[j];
          if (w1.x < w2.x + w2.width && w1.x + w1.width > w2.x &&
              w1.y < w2.y + w2.height && w1.y + w1.height > w2.y) {
            const tempVx = w1.vx; const tempVy = w1.vy;
            w1.vx = w2.vx; w1.vy = w2.vy;
            w2.vx = tempVx; w2.vy = tempVy;
            w1.x += w1.vx; w1.y += w1.vy;
            w2.x += w2.vx; w2.y += w2.vy;
          }
        }
      }
    }

    function update() {
      const cw = canvas.width;
      const ch = canvas.height;
      activeWords.forEach(w => {
        w.x += w.vx;
        w.y += w.vy;
        if (w.x < 2) { w.x = 2; w.vx *= -1; }
        if (w.x > cw - w.width - 2) { w.x = cw - w.width - 2; w.vx *= -1; }
        if (w.y < poolTop) { w.y = poolTop; w.vy *= -1; }
        if (w.y > ch - w.height - 2) { w.y = ch - w.height - 2; w.vy *= -1; }
      });
      handleWordCollisions();
      if (wrongWordTimer > 0) {
        wrongWordTimer--;
        if (wrongWordTimer === 0) wrongWordItem = null;
      }
      draw();
      if (gameActive) requestAnimationFrame(update);
    }

    function draw() {
      const cw = canvas.width;
      const ch = canvas.height;

      // Clear
      ctx.fillStyle = '#fdfcf7';
      ctx.fillRect(0, 0, cw, ch);

      // Paper shadow
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.fillRect(pageX + 3, pageY + 3, pageW, pageH);
      // Paper sheet
      ctx.fillStyle = '#ecece7';
      ctx.fillRect(pageX, pageY, pageW, pageH);
      // Border
      ctx.strokeStyle = 'rgba(139, 128, 115, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(pageX, pageY, pageW, pageH);

      // Quote text inside page
      ctx.textAlign = 'left';
      const textX = pageX + 20;
      const textY = pageY + 30;
      let cdX = textX;
      let cdY = textY;

      quoteWords.forEach((word, idx) => {
        const isFilled = idx < currentIndex;
        ctx.font = 'bold 11px "Courier New"';
        const wordWidth = ctx.measureText(word).width + 6;
        if (cdX + wordWidth > pageX + pageW - 20) {
          cdX = textX;
          cdY += 20;
        }
        ctx.fillStyle = isFilled ? '#b82e24' : 'rgba(0,0,0,0.08)';
        ctx.fillText(word, cdX, cdY);
        cdX += wordWidth;
      });

      // Signature
      ctx.font = 'italic 9px "Courier New"';
      ctx.fillStyle = '#7d756b';
      ctx.textAlign = 'right';
      ctx.fillText("— Franz Kafka", pageX + pageW - 15, pageY + pageH - 22);
      ctx.fillText("Briefe an Ottla (1916)", pageX + pageW - 15, pageY + pageH - 10);

      // Separator line between page and pool
      ctx.strokeStyle = 'rgba(139, 128, 115, 0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pageX, poolTop - 4);
      ctx.lineTo(pageX + pageW, poolTop - 4);
      ctx.stroke();

      // Floating word chips
      activeWords.forEach(w => {
        const isWrong = wrongWordItem === w;
        ctx.fillStyle = isWrong ? '#b82e24' : '#ecece7';
        ctx.strokeStyle = isWrong ? '#b82e24' : 'rgba(139, 128, 115, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.fillRect(w.x, w.y, w.width, w.height);
        ctx.strokeRect(w.x, w.y, w.width, w.height);
        ctx.font = 'bold 11px "Courier New"';
        ctx.fillStyle = isWrong ? '#ffffff' : '#2c2a29';
        ctx.textAlign = 'center';
        ctx.fillText(w.word, w.x + w.width / 2, w.y + 15);
      });
    }

    function finishGame() {
      draw();

      const bookCanvas = document.createElement('canvas');
      bookCanvas.width = pageW;
      bookCanvas.height = pageH;
      const bctx = bookCanvas.getContext('2d');
      bctx.drawImage(canvas, pageX, pageY, pageW, pageH, 0, 0, pageW, pageH);
      const imgData = bookCanvas.toDataURL('image/png');

      setTimeout(() => {
        window.parent.postMessage({ type: 'GAME_SUCCESS', data: imgData }, '*');
      }, 1000);
    }

    // Boot: size canvas, init, run
    resizeCanvas();
    window.addEventListener('resize', () => {
      resizeCanvas();
      draw();
    });
    initWords();

    function startAfterIntro() {
      document.getElementById('introOverlay').classList.add('hidden');
      gameStarted = true;
      requestAnimationFrame(update);
    }
  </script>
</body>
</html>
