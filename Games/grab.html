<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reise-Station XV: Das Grabmal</title>
  <style>
    body {
      background: #fdfcf7;
      color: #2c2a29;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #info {
      display: none;
      font-size: 12px;
      color: #7d756b;
      margin-bottom: 8px;
      text-align: center;
      max-width: 450px;
    }
    /* Game Intro Overlay */
    .intro-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fdfcf7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 2000;
      text-align: center;
      transition: opacity 0.35s ease;
    }
    .intro-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .intro-box {
      background: #fcfaf2;
      border: 1px solid rgba(139, 128, 115, 0.3);
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .intro-stamp {
      border: 2px dashed #b82e24;
      color: #b82e24;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .intro-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #2c2a29;
    }
    .intro-text {
      font-size: 11.5px;
      line-height: 1.5;
      color: #5c5650;
      margin-bottom: 20px;
    }
    .intro-btn {
      background: #b82e24;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 11px;
    }
    .intro-btn:hover {
      background: #962018;
    }
    .canvas-wrapper {
      position: relative;
      border: 1px solid rgba(139, 128, 115, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      max-width: 100%;
    }
    canvas {
      display: block;
      background: #ecece7;
      max-width: 100%;
      height: auto;
    }
    .input-bar {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }
    .text-input {
      flex: 1;
      background: #fcfaf2;
      border: 1px solid rgba(139, 128, 115, 0.25);
      color: #2c2a29;
      padding: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }
    .btn {
      background: #b82e24;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 12px;
    }
    .btn:hover {
      background: #962018;
    }
    .btn:disabled {
      background: rgba(139, 128, 115, 0.15);
      color: rgba(0,0,0,0.25);
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div id="info">Wählen Sie ein Wort, das Sie als Andenken in den Grabstein meißeln möchten.</div>

  <div class="canvas-wrapper">
    <canvas id="graveCanvas" width="400" height="350"></canvas>
  </div>

  <div class="input-bar">
    <input 
      type="text" 
      class="text-input" 
      id="carveWord" 
      placeholder="INSCHRIFT EINGEBEN" 
      maxlength="14" 
      oninput="updateEngraving()">
    <button class="btn" id="carveBtn" onclick="submitEngraving()" disabled>In Stein meißeln</button>
  </div>

  <script>
    let gameStarted = false;
    const canvas = document.getElementById('graveCanvas');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('carveWord');
    const btn = document.getElementById('carveBtn');

    let currentWord = "";

    function draw() {
      // Background paper-tint
      ctx.fillStyle = '#ecece7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw ground soil
      ctx.fillStyle = '#837d74';
      ctx.fillRect(0, 310, canvas.width, 40);
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 310);
      ctx.lineTo(canvas.width, 310);
      ctx.stroke();

      // Draw Tombstone Silhouette
      const tX = 200;
      const tY = 310;
      const tWidth = 160;
      const tHeight = 230;

      ctx.save();
      // Draw Stone Fill with gradient
      const stoneGrad = ctx.createLinearGradient(tX - tWidth/2, tY - tHeight, tX + tWidth/2, tY);
      stoneGrad.addColorStop(0, '#9e9e9a');
      stoneGrad.addColorStop(0.5, '#8c8c88');
      stoneGrad.addColorStop(1, '#6f6f6b');
      ctx.fillStyle = stoneGrad;

      ctx.beginPath();
      // Double arch top (Jewish style tombstones)
      ctx.moveTo(tX - tWidth/2, tY);
      ctx.lineTo(tX - tWidth/2, tY - tHeight + 40);
      ctx.quadraticCurveTo(tX - tWidth/2, tY - tHeight, tX - tWidth/4, tY - tHeight);
      ctx.lineTo(tX + tWidth/4, tY - tHeight);
      ctx.quadraticCurveTo(tX + tWidth/2, tY - tHeight, tX + tWidth/2, tY - tHeight + 40);
      ctx.lineTo(tX + tWidth/2, tY);
      ctx.closePath();
      ctx.fill();
      
      // Tombstone Border
      ctx.strokeStyle = '#4e4e4a';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      // Stone textures (cracks & erosion)
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      // Draw a crack on left
      ctx.beginPath();
      ctx.moveTo(tX - tWidth/2 + 20, tY - tHeight + 60);
      ctx.lineTo(tX - tWidth/2 + 40, tY - tHeight + 85);
      ctx.lineTo(tX - tWidth/2 + 35, tY - tHeight + 110);
      ctx.stroke();

      // Draw static text (Franz Kafka info)
      drawEngravedText("FRANZ KAFKA", tX, tY - 170, 16, true);
      drawEngravedText("1883 - 1924", tX, tY - 145, 11, false);

      // Star of David outline
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      // Triangle 1
      ctx.moveTo(tX, tY - 225);
      ctx.lineTo(tX - 15, tY - 200);
      ctx.lineTo(tX + 15, tY - 200);
      ctx.closePath();
      // Triangle 2
      ctx.moveTo(tX, tY - 192);
      ctx.lineTo(tX - 15, tY - 217);
      ctx.lineTo(tX + 15, tY - 217);
      ctx.closePath();
      ctx.stroke();

      // Draw custom engraved word
      if (currentWord) {
        drawEngravedText(currentWord, tX, tY - 70, 15, true, '#222225'); // Elegant dark slate engraving
      } else {
        drawEngravedText("[INSCHRIFT]", tX, tY - 70, 11, false, 'rgba(0,0,0,0.15)');
      }

      // Add grass sprigs at base
      ctx.fillStyle = '#4e564a';
      ctx.beginPath();
      ctx.moveTo(110, 310); ctx.lineTo(105, 290); ctx.lineTo(115, 310);
      ctx.moveTo(115, 310); ctx.lineTo(120, 285); ctx.lineTo(123, 310);
      ctx.moveTo(270, 310); ctx.lineTo(265, 295); ctx.lineTo(275, 310);
      ctx.moveTo(280, 310); ctx.lineTo(285, 290); ctx.lineTo(290, 310);
      ctx.fill();
    }

    // Helper to draw text with a 3D engraved look
    function drawEngravedText(text, x, y, size, bold, customColor) {
      ctx.save();
      ctx.font = `${bold ? 'bold' : ''} ${size}px "Courier New"`;
      ctx.textAlign = 'center';

      // 1. Draw light highlight below to simulate depth
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.fillText(text, x + 1, y + 1);

      // 2. Draw dark shadow above
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillText(text, x - 1, y - 1);

      // 3. Draw main text face
      ctx.fillStyle = customColor || '#222225';
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function updateEngraving() {
      if (!gameStarted) return;
      currentWord = input.value.trim().toUpperCase();
      
      if (currentWord.length >= 2) {
        btn.disabled = false;
      } else {
        btn.disabled = true;
      }
      
      draw();
    }

    function submitEngraving() {
      // Ensure it is drawn
      draw();
      
      // Capture
      const imgData = canvas.toDataURL('image/png');
      
      // Post success
      window.parent.postMessage({
        type: 'GAME_SUCCESS',
        data: imgData,
        text: currentWord
      }, '*');
    }

    function startAfterIntro() {
      document.getElementById('introOverlay').classList.add('hidden');
      gameStarted = true;
    }

    // Initial draw
    draw();
  </script>
  <div class="intro-overlay" id="introOverlay">
    <div class="intro-box">
      <div class="intro-stamp">Aufgabe</div>
      <h2 class="intro-title">Das Grab</h2>
      <p class="intro-text">Meißeln Sie ein bedeutsames Wort des Gedenkens als Schlusspunkt der Reise in Franz Kafkas Grabmal auf dem jüdischen Friedhof.</p>
      <button class="intro-btn" onclick="startAfterIntro()">Spiel starten</button>
    </div>
  </div>
</body>
</html>
