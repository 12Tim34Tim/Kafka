<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reise-Station IX: Gefühlszustand zeichnen</title>
  <style>
    body {
      background: #fdfcf7;
      color: #2c2a29;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #info {
      display: none;
      font-size: 12px;
      color: #7d756b;
      margin-bottom: 8px;
      text-align: center;
    }
    .toolbox {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tool-btn {
      background: #fdfcf7;
      border: 1px solid rgba(139, 128, 115, 0.25);
      color: #2c2a29;
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
    }
    .tool-btn.active {
      background: #b82e24;
      border-color: #b82e24;
      color: #fff;
    }
    .canvas-wrapper {
      position: relative;
      border: 1px solid rgba(139, 128, 115, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      max-width: 100%;
    }
    canvas {
      display: block;
      cursor: crosshair;
      background: #ecece7;
      max-width: 100%;
      height: auto;
    }
    .action-bar {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .action-btn {
      background: #fdfcf7;
      border: 1px solid rgba(139, 128, 115, 0.25);
      color: #2c2a29;
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
    }
    .action-btn.submit {
      background: #b82e24;
      border-color: #b82e24;
      color: #fff;
    }
    .action-btn.submit:hover {
      background: #962018;
    }

    /* Game Intro Overlay */
    .intro-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fdfcf7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 2000;
      text-align: center;
      transition: opacity 0.35s ease;
    }
    .intro-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .intro-box {
      background: #fcfaf2;
      border: 1px solid rgba(139, 128, 115, 0.3);
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .intro-stamp {
      border: 2px dashed #b82e24;
      color: #b82e24;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .intro-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #2c2a29;
    }
    .intro-text {
      font-size: 11.5px;
      line-height: 1.5;
      color: #5c5650;
      margin-bottom: 20px;
    }
    .intro-btn {
      background: #b82e24;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 11px;
    }
    .intro-btn:hover {
      background: #962018;
    }
  </style>
</head>
<body>

  <div id="info">Zeichnen Sie Kafkas Hilflosigkeit mit einfachen geometrischen Formen.</div>

  <div class="toolbox">
    <button class="tool-btn active" id="tool-brush" onclick="setTool('brush')">Pinsel</button>
    <button class="tool-btn" id="tool-rect" onclick="setTool('rect')">Rechteck</button>
    <button class="tool-btn" id="tool-circle" onclick="setTool('circle')">Kreis</button>
    <button class="tool-btn" id="tool-line" onclick="setTool('line')">Linie</button>
    <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')">Radierer</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="paintCanvas" width="400" height="350"></canvas>
  </div>

  <div class="action-bar">
    <button class="action-btn" onclick="clearCanvas()">Löschen</button>
    <button class="action-btn submit" onclick="submitDrawing()">Aufgabe abschließen</button>
  </div>

  <div class="intro-overlay" id="introOverlay">
    <div class="intro-box">
      <div class="intro-stamp">Aufgabe</div>
      <h2 class="intro-title">Haus zur Minute</h2>
      <p class="intro-text">Nehmen Sie sich etwas Zeit und versuchen Sie, in dem Spiel Kafkas Gefühlszustand auf der Pawlatsche zu ergründen.</p>
      <button class="intro-btn" onclick="startAfterIntro()">Spiel starten</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let gameStarted = false;
    
    let activeTool = 'brush';
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    
    // Maintain a backup image data for interactive shape preview
    let canvasBackup = null;

    // Fill background color
    function fillBackground() {
      ctx.fillStyle = '#ecece7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    fillBackground();

    // Set brush options
    ctx.strokeStyle = '#1a1a1c';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    function setTool(tool) {
      activeTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tool-${tool}`).classList.add('active');
    }

    // Canvas Events
    canvas.addEventListener('mousedown', startPaint);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopPaint);
    canvas.addEventListener('mouseleave', stopPaint);

    // Touch Support for mobile
    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const clientX = touch.clientX - rect.left;
      const clientY = touch.clientY - rect.top;
      
      startPaint({ offsetX: clientX, offsetY: clientY });
      e.preventDefault();
    });
    
    canvas.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const clientX = touch.clientX - rect.left;
      const clientY = touch.clientY - rect.top;
      
      draw({ offsetX: clientX, offsetY: clientY });
      e.preventDefault();
    });
    
    canvas.addEventListener('touchend', (e) => {
      stopPaint();
      e.preventDefault();
    });

    function startPaint(e) {
      if (!gameStarted) return;
      isDrawing = true;
      startX = e.offsetX;
      startY = e.offsetY;

      // Save canvas state
      canvasBackup = ctx.getImageData(0, 0, canvas.width, canvas.height);

      if (activeTool === 'brush') {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
      }
    }

    function draw(e) {
      if (!isDrawing) return;

      const currentX = e.offsetX;
      const currentY = e.offsetY;

      // Draw tool behavior
      if (activeTool === 'brush') {
        ctx.strokeStyle = '#1a1a1c';
        ctx.lineTo(currentX, currentY);
        ctx.stroke();
      } else if (activeTool === 'eraser') {
        ctx.strokeStyle = '#ecece7'; // Background color eraser
        ctx.lineTo(currentX, currentY);
        ctx.stroke();
      } else {
        // Shapes require restoration of previous canvas state to show clean live preview
        ctx.putImageData(canvasBackup, 0, 0);
        ctx.strokeStyle = '#1a1a1c';
        ctx.fillStyle = 'rgba(26,26,28,0.05)';
        ctx.lineWidth = 3;

        if (activeTool === 'rect') {
          const w = currentX - startX;
          const h = currentY - startY;
          ctx.beginPath();
          ctx.rect(startX, startY, w, h);
          ctx.fill();
          ctx.stroke();
        } else if (activeTool === 'circle') {
          const r = Math.sqrt((currentX - startX) ** 2 + (currentY - startY) ** 2);
          ctx.beginPath();
          ctx.arc(startX, startY, r, 0, 2 * Math.PI);
          ctx.fill();
          ctx.stroke();
        } else if (activeTool === 'line') {
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(currentX, currentY);
          ctx.stroke();
        }
      }
    }

    function stopPaint() {
      isDrawing = false;
    }

    function clearCanvas() {
      if (confirm("Zeichnung wirklich löschen?")) {
        fillBackground();
      }
    }

    function submitDrawing() {
      const imgData = canvas.toDataURL('image/png');
      window.parent.postMessage({
        type: 'GAME_SUCCESS',
        data: imgData
      }, '*');
    }

    function startAfterIntro() {
      document.getElementById('introOverlay').classList.add('hidden');
      gameStarted = true;
    }
  </script>
</body>
</html>
